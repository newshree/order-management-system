# Application name
spring.application.name=api-gateway

# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8000
server.servlet.context-path=/

# ========================================
# SPRING CLOUD GATEWAY CONFIGURATION
# ========================================
# TokenRelay filter is not available in this gateway dependency set.
# If token relay is required, add the appropriate Spring Cloud OAuth2 dependency.
#spring.cloud.gateway.default-filters[0]=TokenRelay
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8001
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=cart-service
# spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8002
spring.cloud.gateway.server.webflux.routes[1].uri=http://cart-service:8002
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8003
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webflux.routes[3].id=inventory-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8004
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webflux.routes[4].id=order-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8005
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[5].id=payment-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8006
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webflux.routes[6].id=auth-service
# spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8007
spring.cloud.gateway.server.webflux.routes[6].uri=http://auth-service:8007
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/auth/**

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.com.ecom.api.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n

# Micrometer Tracing
management.tracing.sampling.probability=1.0

# ========================================
# ACTUATOR CONFIGURATION
# ========================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ========================================
# GATEWAY TIMEOUTS
# ========================================
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30000

# ========================================
# JWT CONFIGURATION
# ========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh.expiration=604800000

# ========================================
# SWAGGER / OPENAPI CONFIGURATION
# ========================================
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========================================
# CORS CONFIGURATION
# ========================================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[0].allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[0].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[0].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[0].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true