spring.application.name=auth-service

# Server Configuration
server.port=8085

# Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/authdb
spring.datasource.username=postgres
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# JWT Configuration
jwt.secret=mySuperSecretKeyForAuthServiceMustBeAtLeast32CharactersLongForHS256
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Logging
logging.level.root=INFO
logging.level.com.ecom=DEBUG

# Swagger / OpenAPI configuration for better sorting
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Management endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
