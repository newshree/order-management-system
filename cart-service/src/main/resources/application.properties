# Application name
spring.application.name=cart-service

# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8002

# ========================================
# DATABASE CONFIGURATION (PostgreSQL)
# ========================================
# spring.datasource.url=jdbc:postgresql://localhost:5433/cartdb
spring.datasource.url=jdbc:postgresql://postgres:5432/cartdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# REDIS CONFIGURATION
# ========================================
# Redis connection settings
# spring.data.redis.host=localhost
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=60000ms

# Redis connection pool settings
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.jedis.pool.max-wait=-1ms

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.com.ecom.cart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n

# Micrometer Tracing
management.tracing.sampling.probability=1.0

# ========================================
# JPA CONFIGURATION
# ========================================
spring.jpa.open-in-view=false

# ========================================
# ACTUATOR CONFIGURATION
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Swagger / OpenAPI configuration for better sorting
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha